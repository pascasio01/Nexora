<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#cfff00">
  <title>NEXORA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>NEXORA</h1>
    <p class="sub">El sistema decide. Tú ejecutas.</p>
  </header>

  <section id="add-section">
    <div class="input-row">
      <input id="taskInput" placeholder="¿Qué hay que hacer?" autocomplete="off" />
      <button id="toggleForm" onclick="toggleForm()">+</button>
    </div>

    <div id="formPanel" class="hidden">
      <div class="form-row">
        <label>Urgencia <span id="urgVal">5</span></label>
        <input type="range" id="urgency" min="1" max="10" value="5"
          oninput="document.getElementById('urgVal').textContent=this.value">
      </div>
      <div class="form-row">
        <label>Impacto <span id="impVal">5</span></label>
        <input type="range" id="impact" min="1" max="10" value="5"
          oninput="document.getElementById('impVal').textContent=this.value">
      </div>
      <div class="form-row">
        <label>Energía requerida <span id="enVal">5</span></label>
        <input type="range" id="energy" min="1" max="10" value="5"
          oninput="document.getElementById('enVal').textContent=this.value">
      </div>
      <div class="form-row">
        <label>Categoría</label>
        <div class="cat-buttons">
          <button class="cat-btn active" data-cat="critical" onclick="selectCat(this)">CRÍTICO</button>
          <button class="cat-btn" data-cat="operative" onclick="selectCat(this)">OPERATIVO</button>
          <button class="cat-btn" data-cat="creative" onclick="selectCat(this)">CREATIVO</button>
        </div>
      </div>
      <button class="add-btn" onclick="addTask()">AGREGAR TAREA</button>
    </div>
  </section>

  <section id="top-section">
    <h2>HOY DEBES HACER</h2>
    <div id="top"></div>
  </section>

  <section id="all-section">
    <h2>PENDIENTES <span id="count"></span></h2>
    <div id="allTasks"></div>
  </section>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
